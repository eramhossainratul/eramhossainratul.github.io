<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="er-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="er-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="er-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#er-bg-grad)" stroke="url(#er-border-grad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Monogram Initials -->
  <text 
    x="50" 
    y="59" 
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="34" 
    font-weight="700" 
    fill="url(#er-text-grad)" 
    text-anchor="middle" 
    letter-spacing="1"
  >
    ER
  </text>
</svg>
